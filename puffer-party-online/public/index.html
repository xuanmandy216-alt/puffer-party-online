<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>河豚炸弹派对 · 中文在线版</title><style>
:root{font-family:ui-rounded,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#f6f2ff;background:#100e23}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#46336c 0,transparent 40%),radial-gradient(ellipse at 90% 80%,#123f56 0,transparent 40%),#100e23}.wrap{max-width:950px;margin:auto;padding:32px 18px 65px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;letter-spacing:1px;font-size:20px}.online{font-size:12px;color:#9ee6cb;background:#164339;border:1px solid #2a725b;padding:7px 12px;border-radius:100px}.hero{text-align:center;padding:30px 0 25px}.hero .puffer{font-size:86px;filter:drop-shadow(0 10px 25px #ed9b5670);animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-9px) rotate(5deg)}}h1{font-size:clamp(29px,6vw,52px);margin:8px 0;font-weight:1000;letter-spacing:2px}.sub{color:#b8b1d1;margin:8px auto 0;line-height:1.7}.card{background:#242039d9;border:1px solid #514868;border-radius:24px;padding:24px;box-shadow:0 18px 40px #05030a55}.homecard{max-width:500px;margin:auto}.label{font-size:13px;font-weight:700;color:#c8bfe3;margin:15px 0 8px}input,select{width:100%;border:1px solid #5a5075;background:#171429;color:#fff;border-radius:13px;padding:14px 15px;font:inherit;outline:none}input:focus,select:focus{border-color:#ffcf74;box-shadow:0 0 0 3px #ffcf7422}button{cursor:pointer;border:0;border-radius:14px;font:inherit;font-weight:900;padding:14px 20px;transition:transform .1s,opacity .1s}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:linear-gradient(135deg,#ffd36f,#ff915a);color:#392033}.secondary{background:#3a3353;color:#f8f5ff;border:1px solid #5e547a}.full{width:100%}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#aaa1c4;font-size:13px}.hidden{display:none!important}.roomtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.code{font-size:26px;font-weight:1000;letter-spacing:5px;color:#ffdb84}.pill{border:1px solid #6a5a83;background:#332b4d;border-radius:100px;padding:7px 13px;font-size:13px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:15px 0}.player{padding:14px;background:#302b49;border:2px solid #50476a;border-radius:17px;min-width:0}.player.active{border-color:#ffcf74;background:#4a3850;box-shadow:0 0 22px #f4b04e33}.player.dead{opacity:.42}.player .name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player .hearts{font-size:18px;margin-top:6px}.player small{font-size:11px;color:#c8bfe3}.question{background:linear-gradient(135deg,#44305d,#2a4761);border-radius:20px;padding:24px 16px;text-align:center;margin:18px 0}.question .q{font-size:clamp(23px,4.7vw,37px);font-weight:1000;margin:10px 0}.timer{height:12px;background:#151326;border-radius:20px;overflow:hidden;margin:20px 0 5px}.timerbar{height:100%;width:100%;background:linear-gradient(90deg,#72e0bc,#ffe078,#ff6b7b);transition:width .12s linear}.answerbox{display:flex;gap:10px;margin:16px 0}.answerbox input{flex:1;min-width:0}.event{text-align:center;font-size:19px;font-weight:900;min-height:31px;margin:13px 0}.history{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:12px;border:1px solid #544b70;border-radius:100px;padding:7px 11px;color:#d8d1ed}.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.setting{min-width:0}.setting label{display:block;font-size:12px;margin-bottom:7px;color:#c8bfe3}.hint{line-height:1.8;font-size:13px;color:#bdb4d6}.notice{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:14px;background:#fff0c5;color:#38253c;box-shadow:0 12px 40px #0008;font-weight:800;z-index:10;max-width:90%;text-align:center}.footer{text-align:center;margin-top:30px;color:#827a9f;font-size:12px}@media(max-width:520px){.wrap{padding:18px 12px 55px}.card{padding:17px}.hero{padding:22px 0}.hero .puffer{font-size:68px}.split{grid-template-columns:1fr}.answerbox{flex-direction:column}.settings{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">🐡 PUFFER PARTY <span style="color:#ffd078">中文在线版</span></div><span class="online" id="connection">● 连接中</span></div>
<section id="home"><div class="hero"><div class="puffer">🐡</div><h1>河豚炸弹派对</h1><p class="sub">脑子转快点，河豚要炸了！<br>创建房间，邀请朋友用各自的手机一起玩。</p></div><div class="card homecard"><div class="label">你的昵称</div><input id="nickname" maxlength="24" placeholder="例如：派对之王" autocomplete="nickname"><div class="split" style="margin-top:17px"><button class="primary" id="create">✨ 创建房间</button><button class="secondary" id="joinToggle">🔑 加入房间</button></div><div id="joinPanel" class="hidden"><div class="label">6 位房间码</div><input id="joinCode" maxlength="6" placeholder="例如 A1B2C3" autocapitalize="characters" style="text-transform:uppercase"><button class="primary full" id="join" style="margin-top:12px">加入游戏 →</button></div></div><p class="footer">2–10 人 · 免费游玩 · 所有人打开同一个网址</p></section>
<section id="room" class="hidden"><div class="roomtop"><div><div class="muted">房间代码 · 发给朋友</div><div class="code" id="roomCode">------</div></div><div style="display:flex;gap:8px"><button class="secondary" id="copyInvite">📋 复制邀请</button><button class="secondary" id="leave">退出</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong id="phaseTitle">等待玩家加入</strong><span class="pill" id="count">0/10 人</span></div><div class="players" id="players"></div><div id="lobby"><div id="hostSettings" class="hidden"><h3>⚙️ 房主设置</h3><div class="settings"><div class="setting"><label>每人生命值</label><select id="lives"><option value="1">1 颗心</option><option value="2">2 颗心</option><option value="3" selected>3 颗心</option><option value="4">4 颗心</option><option value="5">5 颗心</option></select></div><div class="setting"><label>题目类型</label><select id="category"><option value="all">全部混合</option><option value="everyday">日常常识</option><option value="funny">搞怪脑洞</option><option value="friends">朋友聚会</option></select></div><div class="setting"><label>最短爆炸时间（秒）</label><select id="minSeconds"><option>5</option><option>8</option><option selected>12</option><option>15</option><option>20</option></select></div><div class="setting"><label>最长爆炸时间（秒）</label><select id="maxSeconds"><option>18</option><option selected>28</option><option>35</option><option>45</option><option>60</option></select></div></div><button class="primary full" id="start" style="margin-top:18px">🚀 开始游戏</button></div><p class="hint" id="waitMessage">等待房主开始游戏…</p></div>
<div id="game" class="hidden"><div class="question"><div class="muted" id="roundLabel">第 1 轮</div><div class="q" id="question">准备好了吗？</div><div id="turnLabel" style="color:#ffdd85;font-weight:900">轮到谁了？</div><div class="timer"><div class="timerbar" id="timerbar"></div></div><div class="muted">💣 不知道什么时候会爆炸！</div></div><div class="event" id="event"></div><div class="answerbox" id="answerbox"><input id="answer" placeholder="轮到你时输入中文答案…" maxlength="24" autocomplete="off"><button class="primary" id="submit">提交并传递 🐡</button></div><p class="hint" id="gameHint">不能重复已出现的答案。开放题由朋友自行判断是否合理。</p><div class="muted" style="margin:15px 0 9px">本轮已使用的答案</div><div class="history" id="history"></div></div>
<div id="end" class="hidden" style="text-align:center;padding:25px 0"><div style="font-size:70px">🏆</div><h2 id="winner">胜利！</h2><p class="sub">这局结束了，还要再来一局吗？</p><button class="primary" id="again">再玩一局</button></div></div><p class="footer">游戏数据暂存于服务器内存 · 房间无人时自动销毁 · 刷新页面会离开房间</p></section></main><div class="notice hidden" id="notice"></div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);const socket=io();let state=null,myId=null,roomCode=null;let toastTimer;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(msg){$('notice').textContent=msg;$('notice').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('notice').classList.add('hidden'),3000)}
function lobby(){ $('home').classList.remove('hidden');$('room').classList.add('hidden');state=null;myId=null;roomCode=null;history.replaceState(null,'',location.pathname)}
socket.on('connect',()=>{$('connection').textContent='● 已连接';$('connection').style.color='#9ee6cb'});socket.on('disconnect',()=>{$('connection').textContent='● 连接断开';$('connection').style.color='#ff9e9e';if(state)toast('网络断开，重新连接后请重新加入房间')});socket.on('notice',x=>toast(x.message));
$('joinToggle').onclick=()=>$('joinPanel').classList.toggle('hidden');function name(){return $('nickname').value.trim()}function enter(event,data){if(!event.ok)return toast(event.error);myId=event.id;roomCode=event.code;$('home').classList.add('hidden');$('room').classList.remove('hidden');history.replaceState(null,'',location.pathname+'?room='+roomCode)}
$('create').onclick=()=>{if(!name())return toast('先输入昵称');socket.emit('createRoom',{name:name()},enter)};$('join').onclick=()=>{if(!name())return toast('先输入昵称');socket.emit('joinRoom',{name:name(),code:$('joinCode').value},enter)};$('joinCode').onkeydown=e=>{if(e.key==='Enter')$('join').click()};$('leave').onclick=()=>{socket.emit('leave');lobby()};$('copyInvite').onclick=async()=>{const url=location.origin+location.pathname+'?room='+roomCode;const msg='来玩河豚炸弹派对！房间码：'+roomCode+'\n'+url;try{await navigator.clipboard.writeText(msg);toast('邀请链接已复制')}catch{prompt('复制这个邀请链接',msg)}};
for(const id of ['lives','category','minSeconds','maxSeconds'])$(id).onchange=()=>{if(!state)return;socket.emit('settings',{lives:Number($('lives').value),category:$('category').value,minSeconds:Number($('minSeconds').value),maxSeconds:Number($('maxSeconds').value)})};$('start').onclick=()=>socket.emit('start');$('again').onclick=()=>socket.emit('start');
function submit(){const answer=$('answer').value.trim();if(!answer)return toast('先输入答案');socket.emit('answer',{answer},r=>{if(!r.ok)toast(r.error);else $('answer').value=''})}$('submit').onclick=submit;$('answer').onkeydown=e=>{if(e.key==='Enter')submit()};
socket.on('state',s=>{if(!roomCode||s.code!==roomCode)return;const old=state;state=s;const host=s.hostId===myId;const playing=s.phase==='playing';$('roomCode').textContent=s.code;$('count').textContent=s.players.length+'/10 人';$('players').innerHTML=s.players.map(p=>`<div class="player ${p.id===s.turnId&&playing?'active':''} ${p.lives===0?'dead':''}"><div class="name">${p.id===s.hostId?'👑 ':''}${esc(p.name)}${p.id===myId?' (你)':''}</div><div class="hearts">${'❤️'.repeat(p.lives)}${p.lives===0?'💀':''}</div><small>${p.id===s.turnId&&playing?'🐡 正在答题':p.lives===0?'已淘汰':'准备就绪'}</small></div>`).join('');$('lobby').classList.toggle('hidden',s.phase!=='waiting');$('game').classList.toggle('hidden',!['playing','intermission'].includes(s.phase));$('end').classList.toggle('hidden',s.phase!=='finished');$('hostSettings').classList.toggle('hidden',!host);$('waitMessage').classList.toggle('hidden',host);$('start').disabled=s.players.length<2;$('phaseTitle').textContent={waiting:'⏳ 等待玩家',playing:'🔥 游戏进行中',intermission:'💥 爆炸了！',finished:'🎉 游戏结束'}[s.phase];if(s.phase==='waiting')for(const id of ['lives','category','minSeconds','maxSeconds'])$(id).value=s.settings[id];if(s.phase==='finished'){$('winner').textContent=(s.players.find(p=>p.id===s.winnerId)?.name||'无人')+' 获胜！';$('again').classList.toggle('hidden',!host)}if(['playing','intermission'].includes(s.phase)){$('roundLabel').textContent='第 '+s.round+' 轮';$('question').textContent=s.question;const p=s.players.find(p=>p.id===s.turnId);$('turnLabel').textContent=s.phase==='intermission'?'等待下一轮…':s.turnId===myId?'⚡ 轮到你了！快回答！':'🐡 河豚在 '+(p?.name||'玩家')+' 手上';$('answerbox').classList.toggle('hidden',!playing||s.turnId!==myId);$('history').innerHTML=s.used.map(x=>`<span class="chip">${esc(x.name)}：${esc(x.answer)}</span>`).join('')||'<span class="muted">还没有答案</span>';$('event').textContent=s.lastEvent?.type==='explode'?'💥 '+s.lastEvent.name+' 被炸掉一颗心！':s.lastEvent?.type==='answer'?'✨ '+s.lastEvent.name+'：'+s.lastEvent.answer:s.phase==='playing'?'🐡 河豚开始传递！':'';if(s.turnId===myId&&(!old||old.turnId!==myId||old.round!==s.round))$('answer').focus()}});
function tick(){if(state?.phase==='playing'&&state.deadline){const rem=Math.max(0,state.deadline-Date.now());const max=state.settings.maxSeconds*1000;$('timerbar').style.width=Math.min(100,rem/max*100)+'%'}else $('timerbar').style.width='0%';requestAnimationFrame(tick)}tick();const q=new URLSearchParams(location.search).get('room');if(q){$('joinCode').value=q.toUpperCase().slice(0,6);$('joinPanel').classList.remove('hidden')}
</script></body></html>
