<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐡 河豚炸弹派对</title><style>
:root{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;color:#f9f2ff;background:#101026}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#4b376b,transparent 50%),radial-gradient(circle at 95% 80%,#14516b,transparent 50%),#101026;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:24px 14px 80px}.top,.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:1000;letter-spacing:1px}.hero{text-align:center;padding:32px 0}.fish{font-size:90px;display:inline-block;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-10px) rotate(8deg)}}.fish.danger{animation:shake .16s infinite}@keyframes shake{50%{transform:translateX(6px) rotate(8deg)}}h1{font-size:clamp(30px,6vw,54px);margin:8px}.sub,.muted{color:#c5b9d8}.muted{font-size:13px}.card{background:#26213ddc;border:1px solid #655478;border-radius:22px;padding:22px;box-shadow:0 16px 40px #0004}.homecard{max-width:520px;margin:auto}input,select{background:#17152c;color:white;border:1px solid #675779;padding:13px;border-radius:12px;font:inherit;width:100%}input:disabled{opacity:.5}button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:linear-gradient(120deg,#ffe17c,#ffa16a);color:#392336}.secondary{background:#42385c;color:white;border:1px solid #716288}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.label{font-size:13px;font-weight:800;margin:15px 0 7px}.code{font-size:28px;color:#ffe38c;font-weight:1000;letter-spacing:5px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:18px 0}.player{background:#352c50;border:2px solid #605376;border-radius:14px;padding:12px}.player.active{border-color:#ffe07e;box-shadow:0 0 20px #ffce7440}.player.dead{opacity:.55}.name{font-weight:900;overflow-wrap:anywhere}.hearts{margin:7px 0}.question{text-align:center;padding:25px 10px;background:linear-gradient(135deg,#52355e,#234b63);border-radius:18px}.q{font-size:clamp(24px,4vw,36px);font-weight:1000;margin:12px 0}.countdown{font-size:34px;font-weight:1000;color:#ffe58b}.countdown.danger{color:#ff737a}.timer{height:12px;background:#151426;border-radius:10px;overflow:hidden}.bar{height:100%;background:#75dbbb;width:100%}.bar.danger{background:#ff6b77}.answerbox{display:flex;gap:8px;margin:20px 0}.answerbox input{flex:1;min-width:0}.newQuestion{background:#ffdf86;color:#382644;padding:14px;border-radius:14px;text-align:center;font-size:22px;font-weight:1000;margin:12px 0;animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.92);opacity:.2}to{transform:scale(1);opacity:1}}.event{text-align:center;font-size:19px;font-weight:900;min-height:34px;margin:16px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.categories{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.categories label{background:#3a3255;padding:9px;border-radius:10px}.categories input{width:auto}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff0c5;color:#32223a;padding:14px 20px;border-radius:12px;z-index:5;max-width:90%}.ranking{width:100%;border-collapse:collapse}.ranking td,.ranking th{padding:10px;border-bottom:1px solid #655478;text-align:left}.avatar{font-size:27px}.history{max-height:220px;overflow:auto;background:#19172b;border-radius:12px;padding:12px;margin:12px 0}.historyrow{padding:7px 4px;border-bottom:1px solid #4c415f;overflow-wrap:anywhere}.historyrow:last-child{border-bottom:0}.footer{text-align:center;color:#a79bbd;font-size:12px;margin-top:25px}@media(max-width:520px){.settings,.split{grid-template-columns:1fr}.answerbox{flex-direction:column}.card{padding:15px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">🐡 PUFFER PARTY · 中文联机版</div><span id="connection" class="muted">连接中…</span></div><section id="home"><div class="hero"><div class="fish">🐡</div><h1>河豚炸弹派对</h1><p class="sub">15 秒内答对，快把河豚传出去！</p></div><div class="card homecard"><div class="label">你的昵称</div><input id="nickname" maxlength="24" placeholder="输入昵称"><div class="split" style="margin-top:15px"><button class="primary" id="create">创建房间</button><button class="secondary" id="joinToggle">加入房间</button></div><div id="joinPanel" class="hidden"><div class="label">房间码</div><input id="joinCode" maxlength="6" placeholder="6 位房间码"><button class="primary" id="join" style="width:100%;margin-top:10px">加入</button></div></div></section><section id="room" class="hidden"><div class="between" style="margin:18px 0"><div><div class="muted">房间码</div><div id="roomCode" class="code">------</div></div><div><button id="copyInvite" class="secondary">复制邀请</button> <button id="leave" class="secondary">退出</button></div></div><div class="card"><div class="between"><strong id="phaseTitle">等待玩家</strong><span id="count" class="muted"></span></div><div class="players" id="players"></div><div id="lobby"><div id="hostSettings" class="hidden"><h3>房主设置</h3><div class="settings"><div><div class="label">初始生命值</div><select id="lives"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></div><div><div class="label">答题时间</div><input value="15 秒（固定）" disabled></div></div><div class="label">选择题库（至少一个）</div><div id="categories" class="categories"></div><button class="primary" id="start">开始游戏</button></div><button class="secondary" id="ready" style="margin-top:14px">点击准备</button><button class="secondary" id="reroll" style="margin-top:14px">🎲 换头像</button><p class="muted" id="waitMessage">等待所有参赛玩家准备…</p></div><div id="game" class="hidden"><div class="question"><div class="muted" id="roundLabel"></div><div id="fish" class="fish">🐡</div><div class="q" id="question"></div><div id="turnLabel"></div><div class="countdown" id="countdown">15.0</div><div class="timer"><div id="bar" class="bar"></div></div></div><div id="newQuestion" class="newQuestion hidden">✨ 新题目！准备 3 秒 ✨</div><div id="event" class="event"></div><div class="label">本题所有玩家的提交记录 · <span id="answerCount">0/5 次正确</span></div><div id="answerHistory" class="history"><span class="muted">暂无答案</span></div><div class="answerbox"><input id="answer" placeholder="只有轮到你才能输入" maxlength="40"><button id="submit" class="primary">提交答案</button></div><p class="muted">答错或重复可继续尝试；只有超时才扣心。所有玩家都能看到本题的提交答案；全房间共用去重记录。</p><button class="secondary hidden" id="endGame">房主结束游戏</button></div><div id="end" class="hidden"><h2 id="winner"></h2><table class="ranking"><thead><tr><th>排名</th><th>玩家</th><th>生命</th><th>答对</th><th>答错</th><th>重复</th><th>爆炸</th></tr></thead><tbody id="ranking"></tbody></table><button id="again" class="primary" style="margin-top:18px">重新开始</button></div></div><div class="footer">题库持续扩充中 · 房间保存在服务器内存中</div></section></main><div id="notice" class="notice hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io(),names={everyday:'生活常识',geography:'地理知识',media:'影视音乐',gaming:'游戏电竞',party:'搞怪派对'},avatars=['🐡','🐱','🐶','🦊','🐸','🐰','🐼','🐻','🐯','🐧','🐙','🦄','🐵','🐨','🐢','🦋'];let state=null,myId=null,roomCode=null,token=null,pending=false,clockOffset=0,toastTimer;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function toast(s){$('notice').textContent=s;$('notice').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('notice').classList.add('hidden'),2500)}function save(){if(token)localStorage.setItem('puffer-session',JSON.stringify({token,code:roomCode}))}function enter(r){if(!r?.ok)return toast(r?.error||'连接失败');myId=r.id;roomCode=r.code;token=r.token;save();$('home').classList.add('hidden');$('room').classList.remove('hidden');history.replaceState(null,'',location.pathname+'?room='+roomCode)}function reset(){state=null;myId=null;roomCode=null;token=null;localStorage.removeItem('puffer-session');$('home').classList.remove('hidden');$('room').classList.add('hidden');history.replaceState(null,'',location.pathname)}
$('categories').innerHTML=Object.entries(names).map(([k,v])=>`<label><input type="checkbox" value="${k}" checked> ${v}</label>`).join('');$('joinToggle').onclick=()=>$('joinPanel').classList.toggle('hidden');const name=()=>$('nickname').value.trim();$('create').onclick=()=>socket.emit('createRoom',{name:name()},enter);$('join').onclick=()=>socket.emit('joinRoom',{code:$('joinCode').value,name:name()},enter);$('joinCode').onkeydown=e=>{if(e.key==='Enter')$('join').click()};$('leave').onclick=()=>{socket.emit('leave');reset()};$('copyInvite').onclick=async()=>{const url=location.origin+location.pathname+'?room='+roomCode;try{await navigator.clipboard.writeText('来玩河豚炸弹派对！房间码：'+roomCode+'\n'+url);toast('已复制邀请链接')}catch{prompt('复制链接',url)}};function settings(){socket.emit('settings',{lives:Number($('lives').value),categories:[...document.querySelectorAll('#categories input:checked')].map(x=>x.value)})}$('lives').onchange=settings;document.querySelectorAll('#categories input').forEach(x=>x.onchange=settings);$('ready').onclick=()=>{const p=state?.players.find(x=>x.id===myId);socket.emit('ready',!p?.ready)};$('reroll').onclick=()=>socket.emit('reroll');$('start').onclick=()=>socket.emit('start');$('again').onclick=()=>socket.emit('start');$('endGame').onclick=()=>{if(confirm('确定要立即结束这局游戏并显示当前排名吗？'))socket.emit('endGame')};function submit(){if(pending||!state||state.phase!=='playing'||state.turnId!==myId)return;const answer=$('answer').value.trim();if(!answer)return toast('请输入答案');pending=true;refreshInput();socket.emit('answer',{answer},r=>{pending=false;if(!r?.ok)toast(r?.error||'提交失败');else if(r.result==='correct')$('answer').value='';else if(r.result==='wrong'||r.result==='duplicate')$('answer').value='';refreshInput()})}$('submit').onclick=submit;$('answer').onkeydown=e=>{if(e.key==='Enter')submit()};function refreshInput(){const can=state?.phase==='playing'&&state.turnId===myId&&!pending;$('answer').disabled=!can;$('submit').disabled=!can;}
socket.on('connect',()=>{$('connection').textContent='● 已连接';const saved=JSON.parse(localStorage.getItem('puffer-session')||'null');if(saved?.token)socket.emit('resume',{token:saved.token},r=>{if(r?.ok)enter(r);else localStorage.removeItem('puffer-session')})});socket.on('disconnect',()=>{$('connection').textContent='● 连接断开，正在重连'});socket.on('notice',x=>toast(x.message));socket.on('state',s=>{if(!roomCode||s.code!==roomCode)return;const old=state;state=s;const host=s.hostId===myId,me=s.players.find(p=>p.id===myId);$('roomCode').textContent=s.code;$('count').textContent=s.players.filter(p=>p.role==='player').length+' 名参赛 · '+s.players.filter(p=>p.role==='spectator').length+' 名观战';$('players').innerHTML=s.players.map(p=>`<div class="player ${p.id===s.turnId&&s.phase==='playing'?'active':''} ${p.lives===0&&p.role==='player'?'dead':''}"><div class="name"><span class="avatar">${avatars[p.avatar%avatars.length]}</span> ${p.id===s.hostId?'👑 ':''}${esc(p.name)}${p.id===myId?' (你)':''}</div><div class="hearts">${p.role==='spectator'?'👀 观战':p.forfeited?'🚪 退赛':'❤️'.repeat(p.lives)+(p.lives===0?'💀':'')}</div><small>${p.role==='spectator'?'观战':s.phase==='waiting'?(p.ready?'✅ 已准备':'⌛ 未准备'):(p.id===s.turnId?'🐡 持有河豚':p.connected?'在线':'断线')}</small></div>`).join('');$('lobby').classList.toggle('hidden',s.phase!=='waiting');$('game').classList.toggle('hidden',!['playing','preparing','intermission'].includes(s.phase));$('end').classList.toggle('hidden',s.phase!=='finished');$('hostSettings').classList.toggle('hidden',!host);$('ready').classList.toggle('hidden',me?.role!=='player');$('ready').textContent=me?.ready?'取消准备':'点击准备';$('start').disabled=!host||s.players.filter(p=>p.role==='player').length<2||!s.players.filter(p=>p.role==='player').every(p=>p.ready&&p.connected);$('phaseTitle').textContent={waiting:'⏳ 等待准备',preparing:'📖 新题准备',playing:'🔥 游戏进行中',intermission:'💥 河豚爆炸',finished:'🏆 游戏结束'}[s.phase];if(s.phase==='waiting'){ $('lives').value=s.settings.lives;document.querySelectorAll('#categories input').forEach(x=>x.checked=s.settings.categories.includes(x.value));}
if(s.phase==='finished'){$('winner').textContent=s.winnerId?(s.players.find(p=>p.id===s.winnerId)?.name+' 获胜！'):(s.lastEvent?.type==='exhausted'?'本局已用完所选题库，游戏结束':'本局已结束');$('ranking').innerHTML=s.ranking.map(p=>`<tr><td>${p.rank}</td><td>${esc(p.name)}${p.forfeited?'（退赛）':''}</td><td>${p.lives}</td><td>${p.stats.correct}</td><td>${p.stats.wrong}</td><td>${p.stats.duplicate}</td><td>${p.stats.explosions}</td></tr>`).join('');$('again').classList.toggle('hidden',!host)}if(['playing','preparing','intermission'].includes(s.phase)){$('roundLabel').textContent='第 '+s.round+' 题 · 剩余未出现题目 '+(s.remainingQuestions??'?')+' / '+(s.questionTotal??'?');$('newQuestion').classList.toggle('hidden',s.phase!=='preparing');$('question').textContent=s.question;const p=s.players.find(p=>p.id===s.turnId);$('turnLabel').textContent=s.phase==='preparing'?'新题准备中…':s.phase==='intermission'?'下一轮即将开始':s.turnId===myId?'⚡ 轮到你了！':'🐡 河豚在 '+(p?.name||'玩家')+' 手上';$('answerCount').textContent=(s.correctOnQuestion||0)+'/5 次正确';$('answerHistory').innerHTML=(s.answerHistory||[]).length?(s.answerHistory||[]).map(a=>'<div class="historyrow">'+(a.result==='correct'?'✅':a.result==='duplicate'?'🔁':'❌')+' <strong>'+esc(a.name)+'</strong>：'+esc(a.answer)+' <span class="muted">'+(a.result==='correct'?'正确':a.result==='duplicate'?'重复':'错误')+'</span></div>').join(''):'<span class="muted">暂无答案</span>';$('answerHistory').scrollTop=$('answerHistory').scrollHeight;$('event').textContent=({wrong:'❌ '+(s.lastEvent?.name||'玩家')+' 回答错误',duplicate:'🔁 '+(s.lastEvent?.name||'玩家')+' 的答案已被使用',answer:'✨ '+(s.lastEvent?.name||'玩家')+' 答对了！',explode:'💥 '+(s.lastEvent?.name||'玩家')+' 被炸掉一颗心！'})[s.lastEvent?.type]||'';$('endGame').classList.toggle('hidden',!host);if(s.turnId===myId&&s.phase==='playing'&&(!old||old.turnId!==myId||old.round!==s.round)){$('answer').value='';$('answer').focus()}}refreshInput()});function tick(){if(state){const remaining=state.phase==='playing'?Math.max(0,(state.deadline-Date.now())/1000):state.phase==='preparing'?Math.max(0,(state.prepareUntil-Date.now())/1000):0;$('countdown').textContent=state.phase==='preparing'?'准备 '+remaining.toFixed(1):remaining.toFixed(1)+'s';$('countdown').classList.toggle('danger',state.phase==='playing'&&remaining<=5);$('bar').style.width=(Math.min(15,remaining)/15*100)+'%';$('bar').classList.toggle('danger',remaining<=5);$('fish').classList.toggle('danger',state.phase==='playing'&&remaining<=5)}requestAnimationFrame(tick)}tick();const q=new URLSearchParams(location.search).get('room');if(q){$('joinCode').value=q.toUpperCase().slice(0,6);$('joinPanel').classList.remove('hidden')}
</script></body></html>
